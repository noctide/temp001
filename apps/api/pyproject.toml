[project]
name = "titanloom"
version = "0.0.0"
description = "Titanloom 主程序与后台程序（模块化单体）"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
# 栈：后端详细设计·总图 11
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titanloom"]
