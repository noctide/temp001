# 高保真比对清单（架构维护；执行 Agent 不改，要改提给架构）
# 每页：原型文件、正式页路由、要比的状态（URL 参数；可单独写 viewport，例如手机 390×844；steps 是截图前的操作，
#   如 [{click: ".dk-fab"}, {press: "Control+j"}]）、关键位置。
# `tl.py fidelity` 跑全部或指定页；`tl.py check` 只跑 enabled: true 的页（正式页做出来以后由架构打开）。
#
# 正式页的约定（写进 AGENTS.md / 高保真规范）：
# - 开发模式下认同样的 URL 参数切换示例身份和数据（role=member、empty=1、tab=records ……），数据用原型里的同一份示例数据。
# - probes 里每个名字，正式页对应元素要带 data-fid="<名字>"（或在下面写 app: 选择器）。
# - 动态区域（时钟、随机图）用 mask 盖住（涂成品红），两边一起盖；不在本项比的部分用 hide 两边一起藏掉（留空白）。

defaults:
  viewport: { width: 1440, height: 900 }
  now: "2026-10-03T10:00:00+08:00"   # 两边都把时间定在这一刻（和原型示例数据的"今天"一致）
  timezone: Asia/Shanghai
  max_diff: 0.005                     # 整页像素差异上限 0.5%
  pixel_threshold: 0.1                # 单个像素算"不同"的色差阈值（0–1，pixelmatch）
  box_tolerance: 2                    # 位置 / 大小允许差几像素
  proto_query: shot=1                 # 原型隐藏「原型状态」按钮

# 原型目录：环境变量 TL_PROTOTYPE 优先；否则按顺序找（相对仓库根目录）
prototype_roots:
  - ../../02_Titanloom/fidelity/Prototype     # Windows：D:\05_project\02_Titanloom-dev\hq → D:\05_project\02_Titanloom\fidelity\Prototype
  - ../../fidelity/Prototype                  # 架构 VM：$HOME/mnt/02_Titanloom-dev/hq → $HOME/mnt/fidelity/Prototype

pages:
  - name: 外壳
    project: shell
    enabled: true           # 导航 + 顶栏，10-20 落成
    proto: Forms.html       # 任意一页的外壳都一样，取表单页（导航当前项 = 表单）
    app: /forms
    full_page: false        # 只截一屏
    scope: [".m-rail", ".m-top"]   # 只比这两块的文字
    same_selectors: true    # 外壳用的是公共类名，两边选择器一样（不用 data-fid）
    states:
      - { name: 部门负责人, query: "" }
      - { name: 普通成员, query: role=member }
      - { name: 表单管理员, query: role=zym }
      - { name: 手机, query: "", viewport: { width: 390, height: 844 } }
    probes:
      导航: ".m-rail"
      导航当前项: ".m-rail a.on"
      标志: ".m-logo"
      顶栏: ".m-top"
      部门菜单: ".m-space"
      搜索框: ".m-search"
      消息: ".m-top .m-ib"
      头像: ".m-ava"
    hide:                   # 两边都藏起来（留空白）再截：页面内容不在这一项比
      - ".m-page > *"
    mask: []
    ignore_text: []

  - name: 悬浮窗
    project: shell
    enabled: true           # 悬浮球 + 快捷圈 + 调整快捷圈，10-20 落成（待办 / 客服 / 反馈小窗、抽屉、选取下一步）
    proto: Settings.html    # 取一页没有声明「管家」页面动作的（表单页有「帮我找表单」等，归表单页自己比）
    app: /settings
    full_page: false
    scope: ["#dk-root"]
    same_selectors: true
    hide: [".m-page > *", ".m-rail", ".m-top"]   # 只比悬浮窗；原型「我的设置」页的顶栏是简化版，外壳归「外壳」那项比
    states:
      - { name: 球, query: "" }
      - { name: 球·普通成员, query: role=member }
      - { name: 快捷圈, query: "", steps: [{ click: ".dk-fab" }] }
      - { name: 键盘打开, query: "", steps: [{ press: "Control+j" }] }
      - { name: 调整, query: "", steps: [{ click: ".dk-fab" }, { click: ".dk-rset" }] }
      - { name: 手机·快捷圈, query: "", viewport: { width: 390, height: 844 }, steps: [{ click: ".dk-fab" }] }
      - { name: 手机·调整, query: "", viewport: { width: 390, height: 844 }, steps: [{ click: ".dk-fab" }, { click: ".dk-rrow.set" }] }
    probes:
      悬浮球: ".dk-fab"
      角标: ".dk-fab b"
      选中格: ".dk-ri.on"
      调整: ".dk-rset"
      提示: ".dk-rhint"
      手机列表: ".dk-rsheet"
      设置窗: ".dk-rsp"
    mask: []
    ignore_text: []

  - name: 表单列表
    project: forms
    enabled: false          # 表单第 7 阶段做出正式页后打开
    proto: Forms.html
    app: /forms
    states:
      - { name: 部门负责人, query: "" }
      - { name: 普通成员, query: role=member }
      - { name: 空, query: empty=1 }
      - { name: 我负责的, query: scope=mine }
      - { name: 新建, query: new=1 }
      - { name: 手机, query: "", viewport: { width: 390, height: 844 } }
    probes:
      页头标题: ".fm-head h1"
      新建按钮: ".fm-newbtn"
      搜索框: ".fm-head input"
      导航当前项: ".m-rail a.on"
      顶栏: ".m-top"
      导入提示: ".m-page .m-note"
      第一组: ".fm-group"
      第一行: ".fm-row"
    mask: []
    ignore_text: []
