agent:
  module: agent
  paths: [apps/api/titanloom/agent/, apps/web/src/domains/agent/, i18n/agent.yaml]
  read: [智能管家, 平台能力契约#4, 平台能力契约#5, 平台能力契约#6, 平台能力契约#9.3, 平台能力契约#10, 平台能力契约#11]
