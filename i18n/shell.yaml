    description: 快捷圈格子说明 · 待办
    defaults:
      zh-CN: 等你处理的事
      en-US: Things waiting for you
  dock.ring.help.name:
    description: 快捷圈格子名 · 客服
    defaults:
      zh-CN: 客服
      en-US: Help
  dock.ring.help.desc:
    description: 快捷圈格子说明 · 客服
    defaults:
      zh-CN: 平台怎么用、制度问题
      en-US: How to use the platform, policy questions
  dock.ring.fb.name:
    description: 快捷圈格子名 · 反馈
    defaults:
      zh-CN: 反馈
      en-US: Feedback
  dock.ring.fb.desc:
    description: 快捷圈格子说明 · 反馈
    defaults:
      zh-CN: 问题、建议、报错
      en-US: Problems, ideas, errors
