    defaults:
      zh-CN: 「用智能管家」没开放给你
      en-US: “Use the assistant” isn’t open to you
  dock.ringSet.up:
    description: 往上挪一格（无障碍名称）
    defaults:
      zh-CN: 上移
      en-US: Move up
  dock.ringSet.down:
    description: 往下挪一格（无障碍名称）
    defaults:
      zh-CN: 下移
      en-US: Move down
  dock.ringSet.page:
    description: 是否在「管家」二级里显示这一页声明的动作
    defaults:
