    description: 用键盘打开快捷圈时，圈旁的操作提示
    params:
      name: string
    defaults:
      zh-CN: 回车 = {{name}} · 方向键 · Esc
      en-US: Enter = {{name}} · arrow keys · Esc
  dock.ring.hintDrag:
    description: 用鼠标打开快捷圈时，圈旁的提示
    defaults:
      zh-CN: 按住球可以拖动
      en-US: Press and hold the ball to move it
  dock.ring.ask.name:
    description: 快捷圈格子名（两个字）· 问智能管家
    defaults:
      zh-CN: 管家
      en-US: Ask
  dock.ring.ask.desc:
    description: 快捷圈格子说明 · 管家
    defaults:
