    params:
      count: number
    defaults:
      zh-CN: 快捷圈：问管家、指一下、待办 {{count}} 项、客服、反馈（Ctrl / ⌘ + J）；按住可以拖动
      en-US: "Quick ring: ask the assistant, point at something, {{count}} to-dos, help, feedback (Ctrl / ⌘ + J); press and hold to move"
  dock.fab.tip:
    description: 鼠标停在悬浮球上的提示
    defaults:
      zh-CN: 点开快捷圈 · Ctrl / ⌘ + J · 按住拖动换位置
      en-US: Open the quick ring · Ctrl / ⌘ + J · press and hold to move
  dock.ring.label:
    description: 电脑上快捷圈的无障碍名称
    defaults:
      zh-CN: 快捷圈（方向键选，回车执行，Esc 收起）
      en-US: Quick ring (arrow keys to choose, Enter to run, Esc to close)
