    description: 调整快捷圈小窗顶部说明
    defaults:
      zh-CN: 勾选圈里放哪些，用 ↑ ↓ 排顺序；最多 8 格（含这一页的动作）。只在这台电脑上生效。
      en-US: Tick what goes in the ring and use ↑ ↓ to order it; up to 8 slots (including this page's actions). Applies to this computer only.
  dock.ringSet.locked:
    description: 「管家」格子不能去掉时的说明
    defaults:
      zh-CN: 必留：随时能问管家
      en-US: "Always shown: the assistant is one click away"
  dock.ringSet.agentClosed:
