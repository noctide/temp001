    defaults:
      zh-CN: 选取
      en-US: Pick
  dock.ring.pick.desc:
    description: 快捷圈格子说明 · 选取
    defaults:
      zh-CN: 选页面上的地方，再问管家、问客服、反馈或发给别人
      en-US: Pick a spot on the page, then ask, get help, give feedback or send it to someone
  dock.ring.tasks.name:
    description: 快捷圈格子名 · 我交给管家的任务
    defaults:
      zh-CN: 任务
      en-US: Tasks
  dock.ring.tasks.desc:
    description: 快捷圈格子说明 · 任务
    defaults:
      zh-CN: 我交给管家的事
      en-US: Things I handed to the assistant
  dock.ring.auto.name:
    description: 快捷圈格子名 · 建自动化
    defaults:
      zh-CN: 自动
      en-US: Auto
  dock.ring.auto.desc:
    description: 快捷圈格子说明 · 自动
    defaults:
      zh-CN: 建自动化
      en-US: Create an automation
  dock.ringSet.title:
    description: 调整快捷圈小窗的标题
    defaults:
      zh-CN: 调整快捷圈
      en-US: Adjust quick ring
  dock.ringSet.close:
    description: 调整快捷圈小窗关闭按钮的无障碍名称
    defaults:
      zh-CN: 关闭
      en-US: Close
