      en-US: Plugins can add slots too; they appear once you tick them here. The look follows your personal skin.
  dock.ringSet.home:
    description: 把悬浮球放回右下角
    defaults:
      zh-CN: 球回到右下角
      en-US: Put the ball back in the corner
  dock.ringSet.reset:
    description: 快捷圈恢复默认
    defaults:
      zh-CN: 恢复默认
      en-US: Reset
  dock.ringSet.homeDone:
    description: 球回到右下角后的提示
    defaults:
      zh-CN: 悬浮球回到右下角
      en-US: The ball is back in the corner
  dock.ringSet.resetDone:
    description: 恢复默认后的提示
    defaults:
      zh-CN: 快捷圈恢复默认
      en-US: Quick ring reset
