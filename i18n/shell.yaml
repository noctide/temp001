  dock.ring.adjustTip:
    description: 「调整」按钮的提示
    defaults:
      zh-CN: 勾选圈里放哪些、排顺序
      en-US: Choose what goes in the ring and its order
  dock.ring.adjustMore:
    description: 手机快捷圈列表最后一行
    defaults:
      zh-CN: 调整快捷圈…
      en-US: Adjust quick ring…
